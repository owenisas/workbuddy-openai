# Drop into the active Hermes profile config under providers:.
# Copy WORKBUDDY_ACCESS_TOKEN from ~/.workbuddy-openai/env into that profile's .env.
# Do not change model.default unless you want WorkBuddy as the session default.
# Direct API — no localhost server.

providers:
  workbuddy:
    name: WorkBuddy
    base_url: https://www.workbuddy.ai/v2
    api_key_env: WORKBUDDY_ACCESS_TOKEN
    api: openai-completions
    models:
      - default-model
      - fast-model
      - balanced-model
      - primary-model
      - deep-model
