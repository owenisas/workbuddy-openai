# Drop into ~/.hermes/config.yaml (or the active profile config) under providers:.
# Do not change model.default unless you want WorkBuddy as the session default.
# Gateway must already be running: python3 -m workbuddy_openai serve

providers:
  workbuddy:
    name: WorkBuddy
    base_url: http://127.0.0.1:8787/v1
    api_key: workbuddy-local
    api: openai-completions
    models:
      - hy4-preview
      - hy3
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-5.6-luna
      - fast-model
      - balanced-model
      - primary-model
      - deep-model
      - default-model
