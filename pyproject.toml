[project]
name = "workbuddy-openai"
version = "0.2.0"
description = "Log in to WorkBuddy, then call https://www.workbuddy.ai/v2 from Hermes/OpenCode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "workbuddy-openai-gateway" }]
dependencies = []

[project.scripts]
workbuddy-openai = "workbuddy_openai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workbuddy_openai*"]
